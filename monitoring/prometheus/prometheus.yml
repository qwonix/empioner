global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['service:8080']

  - job_name: 'bot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['bot:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongo-exporter:9216']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: alloy
    static_configs:
      - targets: ['alloy:9080']
