name: empioner

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-java: &java
  <<: *runtime
  init: true
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 45s
  pids_limit: 256

services:
  redis:
    <<: *runtime
    image: redis:7.4.0-alpine
    container_name: redis
    mem_limit: 256m
    environment:
      REDIS_USER: ${REDIS_USER:?Set REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD:?Set REDIS_USER_PASSWORD}
      REDIS_EXPORTER_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?Set REDIS_EXPORTER_PASSWORD}
    command: [sh, /opt/empioner/redis-start.sh]
    volumes:
      - redis_data:/data
      - ./infra/redis-start.sh:/opt/empioner/redis-start.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_USER_PASSWORD" redis-cli --user "$$REDIS_USER" --no-auth-warning ping | grep -qx PONG']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    <<: *runtime
    image: mongo:7.0.25
    container_name: mongo
    mem_limit: 768m
    command: [mongod, --auth, --wiredTigerCacheSizeGB, "0.25", --bind_ip_all]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-empioner_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Set MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:?Set the actual application database}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      MONGODB_USER: ${MONGODB_USER:?Set MONGODB_USER}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD}
      MONGODB_EXPORTER_PASSWORD: ${MONGODB_EXPORTER_PASSWORD:?Set MONGODB_EXPORTER_PASSWORD}
    volumes:
      - mongo_data_db:/data/db
      - mongo_data_configdb:/data/configdb
      - ./infra/mongo-users.js:/docker-entrypoint-initdb.d/10-users.js:ro
      - ./infra/mongo-health.js:/opt/empioner/mongo-health.js:ro
    networks: [data]
    healthcheck:
      test: [CMD, mongosh, --quiet, --nodb, /opt/empioner/mongo-health.js]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    <<: *runtime
    image: postgres:17-alpine
    container_name: postgres
    mem_limit: 768m
    command: [postgres, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, max_connections=40]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?Set POSTGRES_EXPORTER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-monitor.sh:/docker-entrypoint-initdb.d/10-monitor.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    <<: *java
    image: ${BOT_IMAGE:-qwonix/empioner-telegram-bot:unconfigured}
    container_name: bot
    mem_limit: 768m
    depends_on:
      service: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+ExitOnOutOfMemoryError
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_USERNAME: ${REDIS_USER}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_USER_PASSWORD}
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 3s
      SPRING_DATA_REDIS_TIMEOUT: 3s
      BOT_TITLE: ${BOT_TITLE:-Empioner}
      BOT_DESCRIPTION: ${BOT_DESCRIPTION:-Empioner}
      BOT_USERNAME: ${BOT_USERNAME:?Set BOT_USERNAME}
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN}
      BOT_CONFIG_IMAGE_PLACEHOLDER: ${BOT_CONFIG_IMAGE_PLACEHOLDER:?Set image placeholder UUID}
      BOT_CONFIG_SHOW_SHOW_IMAGE_ID: ${BOT_CONFIG_SHOW_SHOW_IMAGE_ID:?Set show image UUID}
      BOT_CONFIG_SHOW_SERIES_IMAGE_ID: ${BOT_CONFIG_SHOW_SERIES_IMAGE_ID:?Set series image UUID}
      BOT_CONFIG_SHOW_SPECIAL_IMAGE_ID: ${BOT_CONFIG_SHOW_SPECIAL_IMAGE_ID:-}
      BOT_CONFIG_SHOW_MOVIE_IMAGE_ID: ${BOT_CONFIG_SHOW_MOVIE_IMAGE_ID:?Set movie image UUID}
      BOT_SINGLE_SHOW_MODE_SHOW_ID: ${BOT_SINGLE_SHOW_MODE_SHOW_ID:-}
      EMPIONER_SERVICE_URL: http://service:8080/graphql
      EMPIONER_SERVICE_USERNAME: ${EMPIONER_SERVICE_USERNAME:-empioner_bot}
      EMPIONER_SERVICE_PASSWORD: ${EMPIONER_SERVICE_PASSWORD:?Set EMPIONER_SERVICE_PASSWORD}
    networks: [application, data, observability-net]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8080/actuator/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  service:
    <<: *java
    image: ${SERVICE_IMAGE:-qwonix/empioner-telegram-service:unconfigured}
    container_name: service
    mem_limit: 1024m
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:+ExitOnOutOfMemoryError
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?connectTimeout=5&socketTimeout=15
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 5000
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_DATABASE: ${MONGODB_DATABASE}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: ${MONGODB_DATABASE}
      SPRING_DATA_MONGODB_USERNAME: ${MONGODB_USER}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      SPRING_SECURITY_USER_NAME: ${EMPIONER_SERVICE_USERNAME:-empioner_bot}
      SPRING_SECURITY_USER_PASSWORD: ${EMPIONER_SERVICE_PASSWORD}
    networks: [application, data, observability-net]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8080/actuator/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  prometheus:
    <<: *runtime
    profiles: [observability]
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [observability-net]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  loki:
    <<: *runtime
    profiles: [observability]
    image: grafana/loki:3.5.5
    container_name: loki
    mem_limit: 768m
    environment: {GOMEMLIMIT: 576MiB}
    command: [-config.file=/etc/loki/loki-config.yaml]
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [observability-net]

  docker-socket-proxy:
    <<: *runtime
    profiles: [observability]
    image: tecnativa/docker-socket-proxy:0.3.0
    mem_limit: 64m
    environment:
      CONTAINERS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    networks: [docker-api]

  alloy:
    <<: *runtime
    profiles: [observability]
    image: grafana/alloy:v1.11.0
    container_name: alloy
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push
    command: [run, --server.http.listen-addr=0.0.0.0:9080, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on: [docker-socket-proxy, loki]
    networks: [observability-net, docker-api]

  grafana:
    <<: *runtime
    profiles: [observability]
    image: grafana/grafana:12.1.0
    container_name: grafana
    mem_limit: 512m
    ports: [127.0.0.1:3000:3000]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    depends_on:
      prometheus: {condition: service_healthy}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [observability-net]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-exporter:
    <<: *runtime
    profiles: [observability]
    image: prometheuscommunity/postgres-exporter:v0.18.0
    container_name: postgres-exporter
    mem_limit: 96m
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: empioner_metrics
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data, observability-net]

  mongo-exporter:
    <<: *runtime
    profiles: [observability]
    image: percona/mongodb_exporter:0.44
    container_name: mongo-exporter
    mem_limit: 96m
    environment:
      MONGODB_URI: mongodb://mongo:27017/admin?authSource=admin
      MONGODB_USER: empioner_metrics
      MONGODB_PASSWORD: ${MONGODB_EXPORTER_PASSWORD}
    depends_on:
      mongo: {condition: service_healthy}
    networks: [data, observability-net]

  redis-exporter:
    <<: *runtime
    profiles: [observability]
    image: oliver006/redis_exporter:v1.78.0
    container_name: redis-exporter
    mem_limit: 96m
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_USER: empioner_metrics
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD}
    depends_on:
      redis: {condition: service_healthy}
    networks: [data, observability-net]

  node-exporter:
    <<: *runtime
    profiles: [observability]
    image: prom/node-exporter:v1.9.1
    mem_limit: 64m
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --no-collector.netdev
      - --no-collector.netclass
      - --no-collector.netstat
      - --no-collector.sockstat
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    volumes: ["/:/host:ro,rslave"]
    networks: [observability-net]

networks:
  application: {}
  data: {internal: true}
  observability-net: {}
  docker-api: {internal: true}

volumes:
  postgres_data:
  redis_data:
  mongo_data_db:
  mongo_data_configdb:
  grafana-storage:
  prometheus_data:
  loki_data:
  alloy_data:
