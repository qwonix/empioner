name: Prepare production VPS
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'dependencies before restore; apps after restore; monitoring last'
        type: choice
        options: [dependencies, apps, monitoring]
        required: true
      confirm_single_poller:
        description: 'For apps: old bot is stopped, restore and data verification are complete'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: empioner-production
  queue: max
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, empioner-prod]
    environment: production
    env:
      EMPIONER_PROJECT_DIR: /opt/empioner
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dependencies
        if: inputs.phase == 'dependencies'
        run: bash scripts/ops/bootstrap.sh dependencies
      - name: Start restored applications
        if: inputs.phase == 'apps'
        env:
          CONFIRMED: ${{ inputs.confirm_single_poller }}
        run: |
          test "$CONFIRMED" = true
          bash scripts/ops/bootstrap.sh apps --confirm-single-poller
      - name: Start observability
        if: inputs.phase == 'monitoring'
        run: bash scripts/ops/monitoring.sh
