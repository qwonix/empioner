name: VPS migration images
on:
  push:
    branches: [infra/vps-migration-images]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: empioner-telegram-bot
            dockerfile: telegram-bot/telegram-bot-microservice/Dockerfile
          - image: empioner-telegram-service
            dockerfile: telegram-service/telegram-service-microservice/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:migration-0f478f1
          cache-from: type=gha
          cache-to: type=gha,mode=max
