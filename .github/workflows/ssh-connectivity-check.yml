name: VPS SSH deployment check
on:
  push:
    branches: [infra/vps-migration-images]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redeploy the running release over SSH
        env:
          DEPLOY_HOST: ${{ secrets.EMPIONER_DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.EMPIONER_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo "Missing or invalid EMPIONER_DEPLOY_HOST" >&2; exit 1; }
          [[ -n "$DEPLOY_SSH_KEY" ]] || { echo "Missing EMPIONER_DEPLOY_SSH_KEY" >&2; exit 1; }
          umask 077
          key_file="$RUNNER_TEMP/empioner-probe-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf 'deploy\n%s\n%s\n' 'qwonix/empioner-telegram-bot@sha256:2b01468464e4eea6b2a5705d29c0b44b1ce46122a4c52550fabaa37fc45748a7' 'qwonix/empioner-telegram-service@sha256:a7e7cf3fbde808c42fd33e43dd8ce023d05ee460ad3911aab1390c85a8dd30cc' | ssh -T -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlias=empioner-production \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/empioner-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            "empioner-deploy@$DEPLOY_HOST"
