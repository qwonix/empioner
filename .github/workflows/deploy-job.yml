name: Docker
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after build (requires EMPIONER_DEPLOY_ENABLED repository variable)
        type: boolean
        default: false
  push:
    tags: [ '*' ]
  pull_request:
    branches: [ master ]
    types: [ closed ]

concurrency:
  group: empioner-production
  queue: max

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml

  version:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out merged commit with tags
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Create the next minor version
        if: github.event_name == 'pull_request'
        shell: bash
        run: bash .github/scripts/release-tag.sh

  docker-build-push-telegram-bot:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/empioner-telegram-bot
          tags: |
            type=sha,format=long

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./telegram-bot/telegram-bot-microservice/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  docker-build-push-telegram-service:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/empioner-telegram-service
          tags: |
            type=sha,format=long

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./telegram-service/telegram-service-microservice/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    if: vars.EMPIONER_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: [self-hosted, linux, x64, empioner-prod]
    environment: production
    needs:
      - docker-build-push-telegram-bot
      - docker-build-push-telegram-service
    env:
      EMPIONER_PROJECT_DIR: /opt/empioner
      BOT_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/empioner-telegram-bot@${{ needs.docker-build-push-telegram-bot.outputs.digest }}
      SERVICE_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/empioner-telegram-service@${{ needs.docker-build-push-telegram-service.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Update applications with health check and image rollback
        run: bash scripts/ops/deploy.sh
